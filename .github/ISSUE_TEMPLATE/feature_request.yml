name: Feature request
description: Suggest a user-facing improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or missing behavior
      description: Explain what isn't working for you and why.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed approach
      description: Describe how the change would help. Please avoid proposals to bypass anti-cheat or access controls.
    validations:
      required: true
