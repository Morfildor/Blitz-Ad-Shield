name: Package Windows tray app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'Blitz-Ad-Shield*.ps1'
      - 'Blitz-Ad-Shield.ico'
      - 'Launch-Blitz-Ad-Shield.vbs'
      - 'Run-*.cmd'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $scripts = @('Blitz-Ad-Shield.ps1', 'Blitz-Ad-Shield-Tray.ps1')
          foreach ($file in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) { Write-Host ($file + ': ' + $parseError.Message) }
              throw ('PowerShell parse errors in ' + $file)
            }
            Write-Host ('PowerShell parsed: ' + $file)
          }
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package portable Windows application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [
              'Blitz-Ad-Shield.ps1',
              'Blitz-Ad-Shield-Tray.ps1',
              'Blitz-Ad-Shield.ico',
              'Launch-Blitz-Ad-Shield.vbs',
              'Run-Blitz-Ad-Shield.cmd',
              'Run-Console-Diagnostics.cmd',
              'README.md',
              'LICENSE'
          ]
          destination = Path('dist/Blitz-Ad-Shield-Tray-v0.3.zip')
          destination.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(destination, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  path = Path(name)
                  if not path.is_file():
                      raise FileNotFoundError(name)
                  archive.write(path, arcname='Blitz-Ad-Shield/' + name)
          print('Created', destination, destination.stat().st_size, 'bytes')
          PY
      - name: Commit downloadable application ZIP
        shell: bash
        run: |
          git config user.name "Morfildor"
          git config user.email "23294363+Morfildor@users.noreply.github.com"
          git add -f dist/Blitz-Ad-Shield-Tray-v0.3.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: package portable Windows tray app"
            git push origin HEAD:main
          fi
