name: Package Windows tray app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'Blitz-Ad-Shield*.ps1'
      - 'Blitz-Ad-Shield.ico'
      - 'Launch-Blitz-Ad-Shield.vbs'
      - 'Run-*.cmd'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package portable Windows application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [
              'Blitz-Ad-Shield.ps1',
              'Blitz-Ad-Shield-Tray.ps1',
              'Blitz-Ad-Shield.ico',
              'Launch-Blitz-Ad-Shield.vbs',
              'Run-Blitz-Ad-Shield.cmd',
              'Run-Console-Diagnostics.cmd',
              'README.md',
              'LICENSE'
          ]
          destination = Path('dist/Blitz-Ad-Shield-Tray-v0.2.zip')
          destination.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(destination, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  path = Path(name)
                  if not path.is_file():
                      raise FileNotFoundError(name)
                  archive.write(path, arcname='Blitz-Ad-Shield/' + name)
          print('Created', destination, destination.stat().st_size, 'bytes')
          PY
      - name: Commit downloadable application ZIP
        shell: bash
        run: |
          git config user.name "Morfildor"
          git config user.email "23294363+Morfildor@users.noreply.github.com"
          git add dist/Blitz-Ad-Shield-Tray-v0.2.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: package portable Windows tray app"
            git push origin HEAD:main
          fi
