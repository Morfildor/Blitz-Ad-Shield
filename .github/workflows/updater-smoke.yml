name: Windows updater integration test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/updater-smoke.yml'
      - 'dist/latest.json'
      - 'Update-Blitz-Ad-Shield.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and apply update in temporary directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'blitz-shield-update-integration'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $install 'VERSION') -Value '0.4.0' -NoNewline
          $expected = (Get-Content -Raw VERSION).Trim()
          $published = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/Morfildor/Blitz-Ad-Shield/main/dist/latest.json?smoke=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" -TimeoutSec 20
          if ([string]$published.version -ne $expected -or [version]$expected -le [version]'0.4.0') {
            throw "The published update manifest must be newer than 0.4.0 and match the expected version ($expected)."
          }
          # Simulate the existing v0.4 tray app downloading while Blitz is open.
          & .\Update-Blitz-Ad-Shield.ps1 -Mode Stage -InstallDir $install
          $stagedVersion = (Get-Content -Raw (Join-Path $install 'VERSION')).Trim()
          if ($stagedVersion -ne '0.4.0') { throw 'Stage mode modified the running version.' }
          $pending = Join-Path $env:LOCALAPPDATA 'BlitzAdShield\Updater\pending.json'
          if (-not (Test-Path -LiteralPath $pending -PathType Leaf)) {
            throw 'Update was not staged for next launch.'
          }
          # Simulate fully closing Blitz and launching Shield again.
          & .\Update-Blitz-Ad-Shield.ps1 -Mode Apply -InstallDir $install
          $actual = (Get-Content -Raw (Join-Path $install 'VERSION')).Trim()
          if ($actual -ne $expected) {
            throw "Updater did not install $expected. Found: $actual"
          }
          $trayScript = Get-Content -Raw (Join-Path $install 'Blitz-Ad-Shield-Tray.ps1')
          if (-not $trayScript.Contains('Version: $displayVersion')) {
            throw 'Installed tray controller does not show the version label.'
          }
          foreach ($file in @('Update-Blitz-Ad-Shield.ps1', 'Start-Blitz-Ad-Shield.ps1', 'Blitz-Ad-Shield-Tray.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $install $file) -PathType Leaf)) {
              throw "Missing installed file: $file"
            }
          }
          Write-Host "Verified updater installed v$actual in an isolated Windows folder."
